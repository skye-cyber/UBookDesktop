name: Enterprise Electron Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    actions: write
    packages: write

jobs:
    # =========================================================
    # 1️⃣ BUILD MATRIX
    # =========================================================
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24.2.0"

            - name: Install Linux tools
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential
                  sudo snap install snapcraft --classic

            - name: Install dependencies
              run: npm install --no-audit --force

            - name: Install native deps
              run: npx electron-builder install-app-deps

            - name: Build React
              run: npm run build:react

            - name: Build Electron
              run: |
                  if [ "${{ runner.os }}" == "Linux" ]; then
                    sudo npm run build:electron -- --linux
                  elif [ "${{ runner.os }}" == "macOS" ]; then
                    sudo npm run build:electron -- --mac
                  elif [ "${{ runner.os }}" == "Windows" ]; then
                    npm run build:electron -- --win
                  fi
              shell: bash

            - name: Remove unwanted files
              shell: bash
              run: |
                  shopt -s nullglob
                  for file in dist/*; do
                    case "$file" in
                      *.blockmap|*.yml|builder-debug.yml) sudo rm -f "$file" ;;
                    esac
                  done

            - name: Fix permissions safely
              shell: bash
              run: |
                sudo chown -R $USER:$USER dist
                chmod -R u+rwX dist

            - name: Generate SHA256 checksums
              shell: bash
              run: |
                  cd dist
                  sha256sum * > SHA256SUMS.txt

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: build-${{ matrix.os }}
                  path: dist/*
                  if-no-files-found: error

    # =========================================================
    # 2️⃣ RELEASE JOB
    # =========================================================
    release:
        name: Publish GitHub Release
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-files

            - name: Flatten artifact folders
              run: |
                  mkdir final
                  find release-files -type f -exec mv {} final/ \;
                  ls -la final

            - name: Determine prerelease
              id: prerelease
              run: |
                  if [[ "${{ github.ref_name }}" == *"-"* ]]; then
                    echo "is_prerelease=true" >> $GITHUB_OUTPUT
                  else
                    echo "is_prerelease=false" >> $GITHUB_OUTPUT
                  fi

            - name: Create Draft Release
              run: |
                  gh release create "${{ github.ref_name }}" \
                    --title "${{ github.ref_name }}" \
                    --generate-notes \
                    --draft \
                    $([[ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]] && echo "--prerelease")
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload all release assets
              run: |
                  for file in final/*; do
                    echo "Uploading $(basename "$file")"
                    gh release upload "${{ github.ref_name }}" "$file" --clobber
                  done
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish Release
              run: |
                  gh release edit "${{ github.ref_name }}" --draft=false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
