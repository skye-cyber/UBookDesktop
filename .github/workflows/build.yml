name: Build Electron App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        fail-fast: [false]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.2.0'

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Install build tools (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install dependencies
      run: npm install --no-cache --verbose --force --no-audit --production

    - name: Run Post Install script
      run: npm run postinstall

    - name: Install electron builder
      run: npm install electron-builder --save

    - name: install native dependencies(--)
      run: npx electron-builder install-app-deps

    - name: Get current version from package.json
      id: get_version
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          echo "CURRENT_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
        else
          echo "CURRENT_VERSION=$(node -p 'require("./package.json").version')'" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Check for previous version
      id: check_version
      run: |
        if [ -f last_version.txt ]; then
          LAST_VERSION=$(cat last_version.txt)
          echo "Last version: $LAST_VERSION"
          echo "Current version: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" == "$LAST_VERSION" ]; then
            echo "No new version detected. Exiting."
            exit 0
          fi
        else
          echo "No previous version found. Proceeding with build."
        fi
      shell: bash

    - name: Clean dist and build directory
      run: rm -rf dist/* build
      shell: bash

    - name: Ensure build directory exists
      run: mkdir -p dist
      shell: bash

    - name: Build react first
      run: npm run build:react

    - name: Build for specific platform
      run: |
        if [ "${{ runner.os }}" == "Linux" ]; then
          # Install snapcraft for snap build
          sudo snap install snapcraft --classic

          # Build DEB separately
          sudo npm run build:electron -- --linux

        elif [ "${{ runner.os }}" == "macOS" ]; then
          # Build the macOS target
          sudo npm run build:electron -- --mac

        elif [ "${{ runner.os }}" == "Windows" ]; then
          # Build the Windows target
          npm run build:electron -- --win

        else
          echo "Unsupported platform: ${{ runner.os }}"
          exit 1
        fi
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      shell: bash

    - name: Check if build directory exists
      run: |
        if [ ! -d "dist" ]; then
          echo "Error: dist directory not found."
          exit 1
        fi
      shell: bash

    - name: show dist content
      run: ls dist
      shell: bash

    - name: Upload release assets (per file)
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
          shopt -s nullglob
          for file in dist/*; do
          # skip directories
          [ -f "$file" ] || continue

          # skip blockmaps and metadata
          case "$file" in
              *.blockmap|*.yml|builder-debug.yml) continue ;;
          esac

          echo "Uploading $(basename "$file")"
          gh release upload "${{ github.ref_name }}" "$file" --clobber
          done
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    - name: Save current version
      run: echo "${{ env.CURRENT_VERSION }}" > last_version.txt
      shell: bash

    - name: Commit and push changes
      run: |
        git config --global core.autocrlf false
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Check for changes
      run: |
        if [ -z "$(git diff --exit-code --quiet last_version.txt)" ]; then
        echo "No changes detected in last_version.txt."
        else
        echo "Changes detected in last_version.txt. Proceeding with commit."
        git add last_version.txt package-lock.json package.json
        git commit -m "Update last_version.txt to ${{ env.CURRENT_VERSION }}"
        git pull --rebase -X ours
        git push
        fi
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PUSH }}

