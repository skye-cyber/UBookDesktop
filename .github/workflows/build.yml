name: Build & Release Electron App

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.2.0'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          sudo snap install snapcraft --classic

      - name: Install dependencies
        run: npm install --no-audit --force

      - name: Install native deps
        run: npx electron-builder install-app-deps

      - name: Build React
        run: npm run build:react

      - name: Build Electron
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            sudo npm run build:electron -- --linux
          elif [ "${{ runner.os }}" == "macOS" ]; then
            sudo npm run build:electron -- --mac
          elif [ "${{ runner.os }}" == "Windows" ]; then
            npm run build:electron -- --win
          fi
        shell: bash

      - name: Show dist contents
        run: ls -la dist

      # Create release (only once per tag)
      - name: Create GitHub Release if not exists
        if: runner.os == 'ubuntu-latest'
        run: |
          gh release view "${{ github.ref_name }}" || \
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload artifacts per file
      - name: Upload release assets (per file)
        shell: bash
        run: |
          shopt -s nullglob
          for file in dist/*; do

            # skip directories
            [ -f "$file" ] || continue

            # skip blockmaps and metadata
            case "$file" in
              *.blockmap|*.yml|builder-debug.yml) continue ;;
            esac

            echo "Uploading $(basename "$file")"
            gh release upload "${{ github.ref_name }}" "$file" --clobber

          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
